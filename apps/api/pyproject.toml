[project]
name = "cmaa-api"
version = "0.3.0"
description = "Cloud Migration Assessment Accelerator API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.8",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.38",
    "psycopg[binary]==3.2.6",
    "alembic==1.14.1",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
    "python-multipart==0.0.20",
    "pypdf==5.3.0",
    "python-docx==1.1.2",
    "openpyxl==3.1.5",
    "openai==1.63.2",
    "azure-search-documents==11.5.2",
    "azure-identity==1.19.0",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
    "aiofiles==24.1.0",
    "networkx==3.6.1",
    "numpy==2.2.3",
    "faiss-cpu==1.9.0.post1",
    "sentence-transformers==3.4.1",
    "pytest==8.3.4",
    "langgraph==0.3.34",
    "langchain-core==0.3.86",
    "tiktoken==0.8.0",
    "rank-bm25==0.2.2",
    "pdfplumber>=0.11,<0.12",
]

[dependency-groups]
dev = [
    "ruff==0.9.6",
    "mypy==1.15.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "eval: slower golden-set regression tests (pipeline end-to-end over sample-data)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
